trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:

# --------------------------------------------------
# Install .NET 10 SDK
# --------------------------------------------------
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'
    includePreviewVersions: true

# --------------------------------------------------
# Verify .NET environment
# --------------------------------------------------
- script: |
    echo "Checking .NET SDK..."
    dotnet --version
    dotnet --info
  displayName: 'Verify .NET SDK'

# --------------------------------------------------
# Show repository structure
# --------------------------------------------------
- script: |
    echo "Repository root:"
    pwd

    echo ""
    echo "Top-level files and directories:"
    find . -maxdepth 2 -type f | sort | head -200
  displayName: 'Inspect repository structure'

# --------------------------------------------------
# Restore all .NET projects
# --------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: 'Restore .NET projects'
  inputs:
    command: 'restore'
    projects: '**/*.csproj'

# --------------------------------------------------
# Build all .NET projects
# --------------------------------------------------
- task: DotNetCoreCLI@2
  displayName: 'Build .NET projects'
  inputs:
    command: 'build'
    projects: '**/*.csproj'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# --------------------------------------------------
# Discover and run test projects
# --------------------------------------------------
- script: |
    echo "Searching for .NET test projects..."

    TEST_PROJECTS=$(find . -type f -name "*.csproj" \
      ! -path "*/bin/*" \
      ! -path "*/obj/*" \
      | grep -Ei '(test|tests)' || true)

    if [ -z "$TEST_PROJECTS" ]; then
      echo "No test project was found in this repository."
      echo "Skipping test execution."
      exit 0
    fi

    echo "Test projects found:"
    echo "$TEST_PROJECTS"

    while IFS= read -r project; do
      echo ""
      echo "Running tests for: $project"
      dotnet test "$project" \
        --configuration $(buildConfiguration) \
        --no-build \
        --logger "trx;LogFileName=$(basename "$project" .csproj).trx"
    done <<< "$TEST_PROJECTS"
  displayName: 'Run automated tests'

# --------------------------------------------------
# Publish test results if any exist
# --------------------------------------------------
- task: PublishTestResults@2
  displayName: 'Publish test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '**/*.trx'
    searchFolder: '$(System.DefaultWorkingDirectory)'
    mergeTestResults: true
    failTaskOnFailedTests: true

# --------------------------------------------------
# Verify microservice source structure
# --------------------------------------------------
- script: |
    echo "Checking microservice directories..."

    test -d OrderService
    test -d PaymentService
    test -d ProductService
    test -d UserService

    echo "All four microservices found successfully."
  displayName: 'Verify microservices'

# --------------------------------------------------
# Verify Kubernetes manifests
# --------------------------------------------------
- script: |
    echo "Checking Kubernetes manifests..."

    if [ ! -d "k8s" ]; then
      echo "ERROR: k8s directory was not found."
      exit 1
    fi

    find k8s -type f -name "*.yaml" -print

    echo ""
    echo "Kubernetes manifests verified."
  displayName: 'Verify Kubernetes manifests'