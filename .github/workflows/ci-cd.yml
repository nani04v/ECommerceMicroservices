      - name: Configure kubectl
        shell: powershell
        run: |
          $kubectlPath = "C:\ProgramData\kubectl"

          if (-not (Test-Path "$kubectlPath\kubectl.exe")) {
              Write-Error "kubectl.exe was not found at $kubectlPath"
              exit 1
          }

          Write-Host "kubectl found at:"
          Write-Host "$kubectlPath\kubectl.exe"

          $kubectlPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$kubectlPath;$env:Path"

          Write-Host ""
          Write-Host "kubectl version:"
          kubectl version --client